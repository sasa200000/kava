name: Build Aura Browser APK

on:
  push:
    paths: ['apps/aura-browser/**', '.github/workflows/build-aura.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create debug keystore
        working-directory: apps/aura-browser
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: apps/aura-browser
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
          gradle assembleDebug --no-daemon
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-debug-apk
          path: apps/aura-browser/app/build/outputs/apk/debug/*.apk

      - name: Commit APK to repo releases/
        if: success()
        run: |
          git config user.name "Hermes CI"
          git config user.email "hermes@kava.ai"
          mkdir -p releases
          APK=$(find apps/aura-browser/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" releases/aura-browser-debug.apk
          git add releases/aura-browser-debug.apk
          git commit -m "APK $(date -u +%Y%m%d-%H%M%S)" || true
          git push
